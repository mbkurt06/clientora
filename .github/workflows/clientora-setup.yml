name: Clientora setup packages
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/clientora-setup.yml', 'manifest.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: windows, arch: amd64}
          - {os: macos-15, target: darwin, arch: arm64}
          - {os: macos-15-intel, target: darwin, arch: amd64}
          - {os: ubuntu-latest, target: linux, arch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test helper
        working-directory: native
        run: go test ./...
      - name: Build Windows setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Set-Location native
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/Clientora-Setup-Windows-x64.exe .
      - name: Build macOS setup DMG
        if: matrix.target == 'darwin'
        shell: bash
        run: |
          mkdir -p dist "stage/Clientora Setup.app/Contents/MacOS"
          (cd native && CGO_ENABLED=0 GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w" -o "../stage/Clientora Setup.app/Contents/MacOS/clientora-setup" .)
          cat > "stage/Clientora Setup.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>clientora-setup</string><key>CFBundleIdentifier</key><string>com.clientora.setup</string><key>CFBundleName</key><string>Clientora Setup</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>0.1.14</string></dict></plist>
          PLIST
          codesign --force --sign - "stage/Clientora Setup.app"
          hdiutil create -volname "Clientora Setup" -srcfolder stage -format UDZO "dist/Clientora-Setup-macOS-${{ matrix.arch }}.dmg"
      - name: Build Debian setup
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p dist stage/DEBIAN stage/usr/bin stage/usr/share/applications
          (cd native && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../stage/usr/bin/clientora-setup .)
          printf 'Package: clientora-setup\nVersion: 0.1.14\nArchitecture: amd64\nMaintainer: Clientora\nDepends: zenity, xdg-utils\nDescription: Clientora Einrichtung und lokaler Dokumentenhelfer\n' > stage/DEBIAN/control
          printf '[Desktop Entry]\nName=Clientora Setup\nExec=clientora-setup\nType=Application\nTerminal=false\nCategories=Office;\n' > stage/usr/share/applications/clientora-setup.desktop
          dpkg-deb --root-owner-group --build stage dist/Clientora-Setup-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Clientora-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
